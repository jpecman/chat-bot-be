[project]
name = "chat-bot-be"
version = "0.1.0"
description = "FastAPI backend for a RAG chatbot over books"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-ollama>=1.1.0",
    "qdrant-client>=1.19.1",
    "langfuse>=5.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
